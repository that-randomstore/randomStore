<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="All Products — That Random Store" />
  <title>All Products | That Random Store</title>
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body>
  <div class="page">
    <div id="site-header"></div>

    <main class="category-page">
      <header class="category-page__intro">
        <p class="category-page__breadcrumb">
          <a href="../index.html">Home</a> / All Products
        </p>
        <h1 class="category-page__title">All Products</h1>
        <p class="category-page__lead">All Products under That Random Store.</p>
      </header>

      <div class="category-filters" data-category-filter role="group" aria-label="Filter by category">
        <button type="button" class="category-filters__btn is-active" data-filter="all" aria-pressed="true">All</button>
        <button type="button" class="category-filters__btn" data-filter="sippers" aria-pressed="false">Sippers</button>
        <button type="button" class="category-filters__btn" data-filter="bottles" aria-pressed="false">Bottles</button>
        <button type="button" class="category-filters__btn" data-filter="kitchenware" aria-pressed="false">Kitchen Ware</button>
        <button type="button" class="category-filters__btn" data-filter="gift-boxes" aria-pressed="false">Gift Boxes</button>
      </div>

      <div class="product-grid" data-product-grid data-products="all"></div>
    </main>

    <div id="related-section"></div>
    <div id="site-footer"></div>

    <script src="../js/includes.js" data-root="../" data-subpage="true" data-related="relates.html"></script>
  </div>
</body>
</html>
